name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [ "3.11", "3.12" ]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run unit tests
        run: python3 -m unittest discover -s tests -v
      - name: Smoke test CLI end-to-end
        run: |
          python3 scripts/har_to_jmx_lite.py scan examples/sample_shop_api.har
          python3 scripts/har_to_jmx_lite.py doc examples/sample_shop_api.har -o /tmp/api.md
          python3 scripts/har_to_jmx_lite.py jmx examples/sample_shop_api.har -o /tmp/flow.jmx --validate
      - name: Build and verify clean marketplace ZIP
        run: python3 scripts/package_skill.py
